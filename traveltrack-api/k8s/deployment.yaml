apiVersion: apps/v1
kind: Deployment
metadata:
  name: traveltrack-api
  namespace: traveltrack
  labels:
    app: traveltrack-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traveltrack-api
  template:
    metadata:
      labels:
        app: traveltrack-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/cardo88/traveltrack-api:2025.11.18.23.10
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: traveltrack-config
                  key: APP_VERSION
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: traveltrack-config
                  key: PORT
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false

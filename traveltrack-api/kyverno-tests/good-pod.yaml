apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: traveltrack
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: c
      image: nginx:1.25.5-alpine
      securityContext:
        runAsNonRoot: true
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
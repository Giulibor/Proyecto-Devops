apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'snake-app'
        static_configs:
          - targets: ['snake-app:8083']
            labels:
              app: snake-app

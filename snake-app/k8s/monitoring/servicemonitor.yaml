apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snake-app
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: snake-app
  namespaceSelector:
    any: true
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

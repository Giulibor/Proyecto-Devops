replicaCount: 3

image:
  repository: registry.example.com/snake-app
  tag: "v1.0.0"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: snake.example.com
  path: /
  tls:
    enabled: true
    secretName: snake-tls